# GitLab CI template for repositories that author bricks (Turian packages); the GitHub counterpart is
# .github/workflows/brick.yml.
#
#   include:
#     - remote: https://raw.githubusercontent.com/MASS4ORG/Turian/main/ci/brick.gitlab-ci.yml
#   brick:
#     extends: .turian-brick
#     variables:
#       BRICK_STORE: store.mass4.org   # publish on a v<version> tag; empty never publishes
#
# Publishing reads two protected, masked CI/CD variables: BRICK_SIGNING_KEY (type File: the OpenSSH private key the
# store trusts) and BRICK_STORE_TOKEN (a store access token with the publish permission).
.turian-brick:
  image:
    name: ghcr.io/mass4org/turian-cli:${TURIAN_VERSION}
    entrypoint: [""]
  variables:
    TURIAN_VERSION: latest
    BRICK_PATH: "."
    BRICK_PRECAST: "--precast"
    BRICK_STORE: ""
    # The brick store is the CI cache: the same lock file always fills it with the same content.
    GAYA_BRICKS: ${CI_PROJECT_DIR}/.gaya-bricks
  cache:
    key: bricks-${CI_PROJECT_ID}
    paths:
      - .gaya-bricks/
  script:
    - turian-cli brick verify "$BRICK_PATH"
    - turian-cli brick pack "$BRICK_PATH" --out .bricks $BRICK_PRECAST
    - |
      if [ -n "$BRICK_STORE" ] && [ -n "${CI_COMMIT_TAG:-}" ]; then
        version=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' "$BRICK_PATH/package.json")
        if [ "$CI_COMMIT_TAG" != "v$version" ]; then
          echo "The tag $CI_COMMIT_TAG does not match package.json version $version." >&2
          exit 1
        fi
        chmod 600 "$BRICK_SIGNING_KEY"
        turian-cli brick login "$BRICK_STORE" --token "$BRICK_STORE_TOKEN"
        turian-cli brick publish "$BRICK_PATH" --store "$BRICK_STORE" --key "$BRICK_SIGNING_KEY" $BRICK_PRECAST
      fi
  artifacts:
    paths:
      - .bricks/
