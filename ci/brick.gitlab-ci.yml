# GitLab CI template for repositories that author bricks (Turian packages); the GitHub counterpart is
# .github/workflows/brick.yml.
#
#   include:
#     - remote: https://raw.githubusercontent.com/MASS4ORG/Turian/main/ci/brick.gitlab-ci.yml
#   brick:
#     extends: .turian-brick
#     variables:
#       BRICK_TWIN: ""                 # skip the bake twin for a brick declaring bake: none
#
# This job verifies and packs without publication credentials. Protected release jobs sign and upload these exact
# qualified archives; the GitHub implementation is .github/workflows/brick-release.yml with tools/BrickRelease.
.turian-brick:
  image:
    name: ghcr.io/mass4org/turian-cli:${TURIAN_VERSION}
    entrypoint: [""]
  variables:
    TURIAN_VERSION: latest
    BRICK_PATH: "."
    BRICK_PRECAST: "--precast"
    BRICK_TWIN: "--twin"
    # The brick store is the CI cache: the same lock file always fills it with the same content.
    GAYA_BRICKS: ${CI_PROJECT_DIR}/.gaya-bricks
  cache:
    key: bricks-${CI_PROJECT_ID}
    paths:
      - .gaya-bricks/
  script:
    - turian-cli brick verify "$BRICK_PATH"
    - turian-cli brick pack "$BRICK_PATH" --out .bricks $BRICK_PRECAST $BRICK_TWIN
  artifacts:
    paths:
      - .bricks/
