# Turian Engine — GitLab CI/CD, runner dispatch
#
# Runner selection
# ─────────────────────────────────────────────────────────────────────────────
# The heavy jobs normally run on a self-hosted runner to avoid burning the
# namespace's compute minutes. GitLab resolves `tags:` when the pipeline is
# created and never re-routes a job, so a job pinned to an offline runner sits
# pending forever rather than falling back. This pipeline therefore resolves the
# runner tag *before* the real jobs exist:
#
#   resolve_runner  — untagged, so either runner can take it; asks the API
#                     whether the self-hosted runner is online and publishes
#                     TURIAN_RUNNER_TAG as a dotenv artifact
#   pipeline        — triggers tools/ci/main.yml as a child pipeline, passing
#                     TURIAN_RUNNER_TAG in; every job there is tagged with it
#
# Note: the `mass4org` group already defines an unrelated `RUNNER_TAG` variable
# (legacy default for other, non-mega4 projects) — deliberately not reused here
# to avoid depending on CI/CD variable precedence ordering to avoid a collision.
#
# Failure modes all fall back to the SaaS runner: the pipeline costs minutes but
# never hangs. To force one side, run the pipeline with a TURIAN_RUNNER_TAG
# variable.
#
# Requirements:
#   1. GITLAB_TOKEN (already defined at the `mass4org` group level, inherited
#      here): personal access token, `read_api` scope, unprotected so feature
#      branches see it too. Used only to list this project's runners and read
#      the self-hosted one's online status; CI_JOB_TOKEN has no access to the
#      runners API.
#   2. LOCAL_RUNNER_ID below must match the self-hosted runner registered on
#      this project (Settings -> CI/CD -> Runners).
#   3. Everything the child pipeline needs — see tools/ci/main.yml.

variables:
  # Self-hosted runner: id + the tag its jobs are pinned to.
  LOCAL_RUNNER_ID: "53858479"
  LOCAL_RUNNER_TAG: "local-runner"
  # GitLab.com SaaS runner used whenever the self-hosted one is unavailable.
  SAAS_RUNNER_TAG: "saas-linux-medium-amd64"

stages:
  - dispatch
  - pipeline

# ── resolve_runner ────────────────────────────────────────────────────────────
# Deliberately untagged: the self-hosted runner accepts untagged jobs, so this
# costs nothing while it is up, and a SaaS runner picks it up when it is down.
resolve_runner:
  stage: dispatch
  image: alpine
  script:
    - |
      if [ -n "$TURIAN_RUNNER_TAG" ]; then
        echo "TURIAN_RUNNER_TAG pinned to '$TURIAN_RUNNER_TAG' by a pipeline variable."
      elif [ -z "$GITLAB_TOKEN" ]; then
        echo "WARNING: GITLAB_TOKEN is unset — cannot probe the self-hosted runner."
        TURIAN_RUNNER_TAG="$SAAS_RUNNER_TAG"
      elif wget -qO- --header="PRIVATE-TOKEN: $GITLAB_TOKEN" \
             "$CI_API_V4_URL/projects/$CI_PROJECT_ID/runners?type=project_type&status=online&per_page=100" \
           | grep -q "\"id\":$LOCAL_RUNNER_ID,"; then
        echo "Self-hosted runner $LOCAL_RUNNER_ID is online."
        TURIAN_RUNNER_TAG="$LOCAL_RUNNER_TAG"
      else
        echo "Self-hosted runner $LOCAL_RUNNER_ID is offline or unreachable."
        TURIAN_RUNNER_TAG="$SAAS_RUNNER_TAG"
      fi
      echo "TURIAN_RUNNER_TAG=$TURIAN_RUNNER_TAG" > runner.env
      cat runner.env
  artifacts:
    reports:
      dotenv: runner.env

# ── pipeline ─────────────────────────────────────────────────────────────────
# `strategy: depend` mirrors the child's status onto this job, so the parent
# pipeline (and any MR attached to it) reflects the real build result.
pipeline:
  stage: pipeline
  needs: [resolve_runner]
  variables:
    TURIAN_RUNNER_TAG: $TURIAN_RUNNER_TAG
    # A child pipeline's own CI_PIPELINE_SOURCE is always "parent_pipeline";
    # forward the parent's so the release rules can still see "schedule".
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - local: tools/ci/main.yml
    strategy: depend
    forward:
      # CHECK_RELEASE is only ever set as a manual "Run pipeline" override, never
      # as a real variable — referencing it directly here (e.g. `CHECK_RELEASE:
      # $CHECK_RELEASE`) would leave the literal unexpanded string `$CHECK_RELEASE`
      # in the child when it's unset, which is truthy and forces check_release on
      # every push. `forward:` only passes it through when it's actually set.
      pipeline_variables: true
