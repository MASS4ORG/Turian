name: Publish on tag

on:
  push:
    tags:
      - "v*"
  # Dispatched by check-new-release.yml, whose own tag push cannot trigger this workflow.
  workflow_dispatch:

env:
  NUKE_TELEMETRY_OPTOUT: "1"
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
  PUBLISH_SELF_CONTAINED: "false"
  PUBLISH_SINGLE_FILE: "false"
  PUBLISH_TRIMMED: "false"

permissions:
  contents: write
  packages: write

jobs:
  nuget:
    if: ${{ vars.RELEASE_REPOSITORY != '' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      # nuget.org must trust MASS4ORG/Turian and publish-on-tag.yml; NUGET_USER identifies the owner.
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        run: ./build.sh PushNuGet --configuration Release --no-local-packages --skip-shaders --verbosity minimal
        env:
          NuGetApiKey: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Upload NuGet packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: .artifacts/dist/packages/
          include-hidden-files: true
          retention-days: 30

  build:
    if: ${{ vars.RELEASE_REPOSITORY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: ./ci/install-nsis.ps1

      # Shaders ship from the .spv committed in the tag (--skip-shaders), but glslc must still be
      # reachable so an un-skipped shader build fails on the shader rather than on exit 127.
      - name: Install glslc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -yqq && sudo apt-get install -yqq glslc

      # Homebrew's shaderc formula is the one that provides the glslc binary.
      - name: Install glslc (macOS)
        if: runner.os == 'macOS'
        run: brew install shaderc

      # Windows artifacts are built on Windows so the installer is installed, used and uninstalled before release.
      - name: Pack and test ${{ matrix.rid }}
        if: runner.os == 'Windows'
        run: ./build.ps1 Pack WindowsInstallerTest --configuration Release --runtime-identifier "${{ matrix.rid }}" --skip-shaders --publish-self-contained "$env:PUBLISH_SELF_CONTAINED" --publish-single-file "$env:PUBLISH_SINGLE_FILE" --publish-trimmed "$env:PUBLISH_TRIMMED" --verbosity minimal

      - name: Pack ${{ matrix.rid }}
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh Pack DebianPackage \
            --configuration "Release" \
            --runtime-identifier "${{ matrix.rid }}" \
            --skip-shaders \
            --publish-self-contained "$PUBLISH_SELF_CONTAINED" \
            --publish-single-file "$PUBLISH_SINGLE_FILE" \
            --publish-trimmed "$PUBLISH_TRIMMED" \
            --verbosity minimal

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.rid }}
          path: .artifacts/dist/*
          include-hidden-files: true
          retention-days: 30

  release:
    needs: build
    if: ${{ vars.RELEASE_REPOSITORY != '' && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TURIAN_BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: .artifacts/dist
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          if ! find .artifacts/dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.exe' \) -print -quit | grep -q .; then
            echo 'No release assets were produced.' >&2
            exit 1
          fi

      - name: Create GitHub release
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh GitHubCreateRelease \
            --github-repository "${{ github.repository }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --verbosity minimal


  # Builds the Turian CLI container image with Podman and pushes it to GHCR. GitHub-hosted runners are full VMs, so no vfs/dind
  # workaround is needed here the way GitLab.com's container-executor runners require.
  container:
    if: ${{ vars.RELEASE_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Install Podman
        run: sudo apt-get update -yqq && sudo apt-get install -yqq podman

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        shell: bash
        run: |
          chmod +x ./build.sh
          GITHUB_OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ./build.sh ContainerPush --container-registries "ghcr.io/$GITHUB_OWNER/turian-cli" --verbosity minimal
