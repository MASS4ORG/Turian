name: Release check

# Checks for commits since the last tag; if there are any, updates CHANGELOG.md, tags the release
# and pushes the commit+tag to GitHub and (if configured) GitLab, then dispatches publish.yml for the new tag.
#
# Idempotent by design: Tag skips a host if that host's remote already has the computed tag, so
# it's safe to run this same check independently from both GitLab and GitHub schedules.
on:
  schedule:
    - cron: "0 13 * * *" # 10:00 BRT (UTC-3, no DST)
  workflow_dispatch:

env:
  NUKE_TELEMETRY_OPTOUT: "1"
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"

permissions:
  contents: write
  actions: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tag release if there are new commits
        run: |
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          chmod +x ./build.sh
          ./build.sh Tag \
            --github-repository "${{ github.repository }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --gitlab-project-path "${{ vars.GITLAB_REPOSITORY_PATH }}" \
            --gitlab-token "${{ secrets.GITLAB_RELEASE_TOKEN }}" \
            --release-branch "${{ github.event.repository.default_branch }}" \
            --verbosity minimal

      # A tag pushed with GITHUB_TOKEN starts no workflows, so publish.yml is dispatched for it explicitly.
      - name: Publish the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_BEFORE" ]; then
            gh workflow run publish.yml --ref "$(git tag --points-at HEAD | head -n1)"
          fi
