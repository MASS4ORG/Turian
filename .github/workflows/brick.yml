# Reusable workflow for repositories that author bricks (Turian packages) or build games from them.
#
#   jobs:
#     brick:
#       uses: MASS4ORG/Turian/.github/workflows/brick.yml@main
#       with:
#         brick-path: .                 # a folder holding package.json, to verify, compile and pack
#         project-path: ''              # a game project, to restore its bricks from the lock file
#
# Production publication uses brick-release.yml and the protected brick-production environment.
name: Brick

on:
  workflow_call:
    inputs:
      brick-path:
        description: Folder of the brick to verify and pack; empty skips packing
        type: string
        default: ""
      project-path:
        description: Folder of a game project whose bricks are restored with --locked; empty skips it
        type: string
        default: ""
      precast:
        description: Compile the brick's assemblies into Precast~ before packing, which also proves they build
        type: boolean
        default: true
      twin:
        description: Bake the brick and pack its bake twin <id>.bake beside it
        type: boolean
        default: false
      turian-version:
        description: Tag of the ghcr.io/mass4org/turian-cli image to run
        type: string
        default: latest

permissions:
  contents: read

jobs:
  brick:
    runs-on: ubuntu-latest
    container: ghcr.io/mass4org/turian-cli:${{ inputs.turian-version }}
    env:
      # The brick store is the CI cache: the same lock file always fills it with the same content.
      GAYA_BRICKS: ${{ github.workspace }}/.gaya-bricks
    steps:
      - uses: actions/checkout@v7

      - name: Cache the brick store
        uses: actions/cache@v6
        with:
          path: .gaya-bricks
          key: bricks-${{ runner.os }}-${{ hashFiles('**/packages-lock.json') }}
          restore-keys: bricks-${{ runner.os }}-

      - name: Restore the project's bricks
        if: inputs.project-path != ''
        run: turian-cli brick restore --locked --project "${{ inputs.project-path }}"

      - name: Verify the brick
        if: inputs.brick-path != ''
        run: turian-cli brick verify "${{ inputs.brick-path }}"

      - name: Pack the brick
        if: inputs.brick-path != ''
        run: turian-cli brick pack "${{ inputs.brick-path }}" --out "${{ github.workspace }}/.bricks" ${{ inputs.precast && '--precast' || '' }} ${{ inputs.twin && '--twin' || '' }}

      - name: Keep the packed brick
        if: inputs.brick-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: brick
          path: .bricks/*
