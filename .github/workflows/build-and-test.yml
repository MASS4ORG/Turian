name: Build and test

on:
  push:
    branches-ignore:
      - "renovate/**"
    tags-ignore:
      - "v*"
  pull_request:

env:
  NUKE_TELEMETRY_OPTOUT: "1"
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # glslc: shader compilation (CompileShaders). fontconfig/dejavu: SkiaSharp text rendering
      # at test-run time (Guinevere UI); the ubuntu-latest image ships neither.
      - name: Install native dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq glslc libfontconfig1 fontconfig fonts-dejavu-core

      # KTX-Software's validator runs in CI only and is never shipped. TextureCookValidationTests runs it over
      # the importer's cooked output; the tests skip when KTX_VALIDATE is unset.
      - name: Install KTX validator
        env:
          KTX_VERSION: "4.4.2"
          KTX_SHA1: "c6b08c817f8c8dd299deccae4f2fbb8d55e9acd2"
        run: |
          archive="$RUNNER_TEMP/KTX-Software-$KTX_VERSION-Linux-x86_64.tar.bz2"
          curl -fsSL -o "$archive" \
            "https://github.com/KhronosGroup/KTX-Software/releases/download/v$KTX_VERSION/KTX-Software-$KTX_VERSION-Linux-x86_64.tar.bz2"
          echo "$KTX_SHA1  $archive" | sha1sum -c -
          mkdir -p "$RUNNER_TEMP/ktx"
          tar -xjf "$archive" -C "$RUNNER_TEMP/ktx" --strip-components=1
          echo "KTX_VALIDATE=$RUNNER_TEMP/ktx/bin/ktx" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ktx/lib" >> "$GITHUB_ENV"

      - name: Restore, compile, test
        run: |
          chmod +x ./build.sh
          ./build.sh Restore Compile TestReport --configuration "Debug" --no-local-packages --verbosity minimal

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Validate all release formats on one runner without tagging or pushing.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install packaging tools
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq glslc podman nsis

      - name: Build Linux packages, NuGet packages and container image
        run: |
          chmod +x ./build.sh
          ./build.sh Pack DebianPackage PackNuGet ContainerBuild \
            --configuration "Release" \
            --runtime-identifier "linux-x64" \
            --no-local-packages \
            --verbosity minimal

      # Drive the image just built the way a gamedev's CI would: create, compile, export and render a project.
      - name: Smoke-test the container image
        run: |
          image=$(podman images --format '{{.Repository}}:{{.Tag}}' --filter reference=turian-cli | head -n1)
          work="$RUNNER_TEMP/turian-smoke"
          mkdir -p "$work"
          turian() { podman run --rm -v "$work:$work" -w "$work" "$image" "$@"; }
          turian new sample
          turian compile sample
          turian export sample
          turian screenshot sample --out screenshot.png
          test -n "$(ls -A "$work/sample/Output")"
          test -s "$work/screenshot.png"

      - name: Build Windows installer and Winget manifests
        run: |
          ./build.sh WingetManifest \
            --configuration "Release" \
            --runtime-identifier "win-x64" \
            --skip-shaders \
            --no-local-packages \
            --packaging-dry-run \
            --verbosity minimal

      - name: Build macOS archive
        run: |
          ./build.sh Pack \
            --configuration "Release" \
            --runtime-identifier "osx-x64" \
            --skip-shaders \
            --no-local-packages \
            --verbosity minimal
