name: CI

on:
  push:
    branches-ignore:
      - "renovate/**"
    tags-ignore:
      - "v*"
  pull_request:

env:
  NUKE_TELEMETRY_OPTOUT: "1"
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # glslc: shader compilation (CompileShaders). fontconfig/dejavu: SkiaSharp text rendering
      # at test-run time (Guinevere UI); the ubuntu-latest image ships neither.
      - name: Install native dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq glslc libfontconfig1 fontconfig fonts-dejavu-core

      - name: Restore, compile, test
        run: |
          chmod +x ./build.sh
          ./build.sh Restore Compile TestReport --configuration "Debug" --verbosity minimal

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-results/
          retention-days: 7
