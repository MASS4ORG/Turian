name: Publish

on:
  push:
    tags:
      - "v*"
  # Dispatched by release.yml, whose own tag push cannot trigger this workflow.
  workflow_dispatch:

env:
  NUKE_TELEMETRY_OPTOUT: "1"
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: "1"
  PUBLISH_SELF_CONTAINED: "false"
  PUBLISH_SINGLE_FILE: "false"
  PUBLISH_TRIMMED: "false"

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install NSIS
        if: matrix.rid == 'win-x64'
        run: choco install nsis --yes --no-progress

      - name: Pack win-x64
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          .\build.ps1 Pack DebianPackage `
            --configuration "Release" `
            --runtime-identifier "${{ matrix.rid }}" `
            --publish-self-contained "$env:PUBLISH_SELF_CONTAINED" `
            --publish-single-file "$env:PUBLISH_SINGLE_FILE" `
            --publish-trimmed "$env:PUBLISH_TRIMMED" `
            --verbosity minimal

      - name: Pack ${{ matrix.rid }}
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh Pack DebianPackage \
            --configuration "Release" \
            --runtime-identifier "${{ matrix.rid }}" \
            --publish-self-contained "$PUBLISH_SELF_CONTAINED" \
            --publish-single-file "$PUBLISH_SINGLE_FILE" \
            --publish-trimmed "$PUBLISH_TRIMMED" \
            --verbosity minimal

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.rid }}
          path: artifacts/*
          retention-days: 30

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TURIAN_BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          if ! find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.exe' \) -print -quit | grep -q .; then
            echo 'No release assets were produced.' >&2
            exit 1
          fi

      - name: Create GitHub release
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh GitHubRelease \
            --github-repository "${{ github.repository }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --verbosity minimal

      - name: Create GitLab release
        if: vars.GITLAB_REPOSITORY_PATH != ''
        shell: bash
        run: |
          ./build.sh GitLabRelease \
            --gitlab-project-path "${{ vars.GITLAB_REPOSITORY_PATH }}" \
            --gitlab-token "${{ secrets.GITLAB_RELEASE_TOKEN }}" \
            --verbosity minimal

  # Builds the Turian CLI container image with Podman and pushes it to GHCR (and the GitLab
  # Container Registry, if configured). GitHub-hosted runners are full VMs, so no vfs/dind
  # workaround is needed here the way GitLab.com's container-executor runners require.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Podman
        run: sudo apt-get update -yqq && sudo apt-get install -yqq podman

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to GitLab Container Registry
        if: vars.GITLAB_REPOSITORY_PATH != ''
        run: echo "${{ secrets.GITLAB_RELEASE_TOKEN }}" | podman login registry.gitlab.com -u "${{ vars.GITLAB_REGISTRY_USER }}" --password-stdin

      - name: Build and push
        shell: bash
        run: |
          chmod +x ./build.sh
          GITHUB_OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRIES="ghcr.io/$GITHUB_OWNER/turian-cli"
          if [ -n "${{ vars.GITLAB_REPOSITORY_PATH }}" ]; then
            REGISTRIES="$REGISTRIES,registry.gitlab.com/${{ vars.GITLAB_REPOSITORY_PATH }}"
          fi
          ./build.sh ContainerPush --container-registries "$REGISTRIES" --verbosity minimal
